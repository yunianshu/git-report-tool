# 三平台打包工作流（发布到 GitHub Releases）
# 触发方式：
#   - 推送 tag（如 v1.0.2）：自动构建并发布正式 Release（dmg/exe/AppImage 可安装文件）
#   - GitHub 页面手动触发（Actions → Build Desktop App → Run workflow）
#
# 说明：
#   - macOS 的 dmg 只能在 macOS 环境构建，本工作流用 macos-latest runner
#   - 用 GITHUB_TOKEN 发布到 Release（需 permissions.contents: write）

name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: 构建 macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:renderer
      - run: npx electron-builder --mac --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dev-project-manager-mac
          path: release/*/*.dmg
          if-no-files-found: error

  windows:
    name: 构建 Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:renderer
      - run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dev-project-manager-windows
          path: release/*/*.exe
          if-no-files-found: error

  linux:
    name: 构建 Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:renderer
      - run: npx electron-builder --linux --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dev-project-manager-linux
          path: release/*/*.AppImage
          if-no-files-found: error
